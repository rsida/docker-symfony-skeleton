---
# docker-symfony-skeleton
#
# Requires local-network-multisite (Traefik) to be running.
# Services do NOT expose host ports — Traefik handles routing and TLS.
#
# Usage:
#   cp .env.example .env   # then edit APP_NAME and APP_DOMAIN
#   make install           # first-time setup (creates Symfony project + runs migrations)
#   make up                # start containers

networks:
  traefik-net:
    name: ${TRAEFIK_NETWORK:-traefik-net}
    external: true
  internal:
    name: ${APP_NAME:-symfony}-net

services:

  # ----------------------------------------------------------
  # Nginx — reverse proxy to PHP-FPM
  # ----------------------------------------------------------
  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    volumes:
      - .:/var/www/html:cached
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - traefik-net
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-traefik-net}"
      # Main app
      - "traefik.http.routers.${APP_NAME:-symfony}.rule=Host(`${APP_DOMAIN:-symfony.local}`)"
      - "traefik.http.routers.${APP_NAME:-symfony}.entrypoints=websecure"
      - "traefik.http.routers.${APP_NAME:-symfony}.tls=true"
      - "traefik.http.routers.${APP_NAME:-symfony}.middlewares=secure-headers@file"
      - "traefik.http.services.${APP_NAME:-symfony}.loadbalancer.server.port=80"

  # ----------------------------------------------------------
  # PHP 8.3-FPM — Symfony application
  # ----------------------------------------------------------
  php:
    build:
      context: ./docker/php
    restart: unless-stopped
    volumes:
      - .:/var/www/html:cached
    environment:
      APP_ENV: ${APP_ENV:-dev}
      APP_SECRET: ${APP_SECRET:-change-me-in-production}
      DATABASE_URL: mysql://${DB_USER:-symfony}:${DB_PASSWORD:-symfony}@mariadb:3306/${DB_NAME:-symfony}?serverVersion=mariadb-11.0.0&charset=utf8mb4
      MAILER_DSN: smtp://mailer:1025
      TRUSTED_PROXIES: "127.0.0.1,REMOTE_ADDR"
      TRUSTED_HOSTS: "^${APP_DOMAIN:-symfony.local}$$"
    networks:
      - internal

  # ----------------------------------------------------------
  # MariaDB 11
  # ----------------------------------------------------------
  mariadb:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-symfony}
      MYSQL_USER: ${DB_USER:-symfony}
      MYSQL_PASSWORD: ${DB_PASSWORD:-symfony}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - internal

  # ----------------------------------------------------------
  # Mailpit — catches all outgoing emails in dev
  # Interface available at mail.<APP_DOMAIN>
  # ----------------------------------------------------------
  mailer:
    image: axllent/mailpit
    restart: unless-stopped
    networks:
      - traefik-net
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-traefik-net}"
      - "traefik.http.routers.${APP_NAME:-symfony}-mail.rule=Host(`mail.${APP_DOMAIN:-symfony.local}`)"
      - "traefik.http.routers.${APP_NAME:-symfony}-mail.entrypoints=websecure"
      - "traefik.http.routers.${APP_NAME:-symfony}-mail.tls=true"
      - "traefik.http.services.${APP_NAME:-symfony}-mail.loadbalancer.server.port=8025"

volumes:
  db_data:
